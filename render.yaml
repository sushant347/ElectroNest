services:
  - type: web
    name: electronest-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn page.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2 --keep-alive 5 --max-requests 500 --max-requests-jitter 50"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: RUN_SEED_DATA
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
